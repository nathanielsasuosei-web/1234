<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline · Meetbeatz</title>
    <meta name="theme-color" content="#050506" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <style>
      /* Self-contained on purpose: this page is the one thing that must render with
         no network, no build output and no JavaScript, so it carries its own styles
         instead of a stylesheet the service worker would have to also cache. */
      :root {
        --ink: #050506;
        --panel: #21080e;
        --line: #54202b;
        --acid: #c6f135;
        --deep-red: #c81e22;
        --cream: #f4f1ea;
        --muted: #8b8b95;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 24px;
        background:
          radial-gradient(120% 80% at 50% 0%, #160207 0%, #070507 46%, #020203 100%);
        color: var(--cream);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        text-align: center;
      }
      main { max-width: 30rem; }
      img { width: 96px; height: 96px; border-radius: 22px; }
      h1 { margin: 24px 0 0; font-size: 1.75rem; letter-spacing: -0.01em; }
      p { margin: 12px 0 0; color: var(--muted); line-height: 1.6; font-size: 0.95rem; }
      .actions { margin-top: 28px; display: flex; flex-direction: column; gap: 12px; }
      a {
        display: inline-block;
        padding: 14px 24px;
        border-radius: 999px;
        font-weight: 700;
        text-decoration: none;
        font-size: 0.95rem;
      }
      a.primary { background: var(--acid); color: var(--ink); }
      a.secondary { border: 1px solid var(--line); color: var(--cream); }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="Meetbeatz" width="96" height="96" />
      <h1>You are offline</h1>
      <p>
        The store needs a connection to load beats and prices. Your cart, your licences and
        your studio bookings are safe — reconnect and everything is exactly where you left it.
      </p>
      <div class="actions">
        <a class="primary" href="/beats">Try the beat store again</a>
        <a class="secondary" href="/account">Go to my account</a>
      </div>
    </main>
  </body>
</html>
