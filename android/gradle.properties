# JVM arguments for the Gradle daemon.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX is required by android-browser-helper; the old support library is not used.
android.useAndroidX=true

# Generate per-module R classes instead of one big merged class.
android.nonTransitiveRClass=true

# Faster repeat builds, and the CI workflow caches ~/.gradle/hooks accordingly.
org.gradle.caching=true
org.gradle.parallel=true

# The app is deliberately free of compile-time flags; nothing here changes behaviour.
